name: Verify Lean development

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/reciprocal-stability
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build pinned Lean project and replay declarations
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          lake-package-directory: projects/reciprocal-stability
          build: true
          build-args: >-
            Kantorovich
            Kantorovich.Stability
            Kantorovich.ThreeCertificates
            Kantorovich.ThreeStability
            Kantorovich.Examples
          use-mathlib-cache: true
          use-github-cache: false

      - name: Replay the five proof modules
        run: lake env lean -DwarningAsError=true SequentialReplay.lean

      - name: Print theorem axiom dependencies
        run: |
          lake env lean -DwarningAsError=true Audit.lean
          lake env lean -DwarningAsError=true StabilityAudit.lean

      - name: Run exact rational sanity checks
        run: |
          python3 sanity_checks.py
          python3 stability_sanity.py
